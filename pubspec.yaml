name: findipro
description: "FindiPro - Find trusted service providers near you (plumbers, mechanics, electricians, and more)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.2 
  geocoding: ^4.0.0
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.1
  firebase_messaging: ^15.2.10

  # UI helpers
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/google_logo.png
